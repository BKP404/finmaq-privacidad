<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada | FinMaq</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f6f3fb;color:#1f1633;padding:16px}
  main{max-width:520px;width:100%;background:#fff;border-radius:16px;padding:40px 28px;
    text-align:center;box-shadow:0 8px 30px rgba(57,0,148,.12);border-top:6px solid #390094}
  .brand{color:#390094;font-weight:800;letter-spacing:.02em;font-size:20px;margin:0 0 24px}
  .code{color:#390094;font-size:64px;font-weight:800;line-height:1;margin:0 0 12px}
  h1{font-size:22px;margin:0 0 12px}
  p{margin:0 0 28px;line-height:1.55;color:#4a4060}
  a.btn{display:inline-block;background:#390094;color:#fff;text-decoration:none;
    padding:12px 22px;border-radius:10px;font-weight:600}
  a.btn:hover,a.btn:focus{background:#2a006e;outline:3px solid #c9b3f0;outline-offset:2px}
  @media (prefers-color-scheme:dark){
    body{background:#140b24;color:#eee8f8}
    main{background:#1e1433;box-shadow:none}
    .brand,.code{color:#b894ff}
    p{color:#c9bfdc}
  }
</style>
</head>
<body>
<main>
  <p class="brand">FinMaq</p>
  <p class="code">404</p>
  <h1>Esta página no existe</h1>

</body>
